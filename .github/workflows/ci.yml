name: DevTrack CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: devtrack_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: [ "5432:5432" ]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Run Django unit tests
        run: |
          cd backend
          python manage.py test

  selenium-ui-tests:
    runs-on: ubuntu-latest
    needs: backend-tests
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Selenium test dependencies
        run: |
          pip install selenium pytest webdriver-manager

      - name: Run Selenium tests (headless Chrome)
        run: |
          pytest tests/selenium/ -v

  api-tests-postman:
    runs-on: ubuntu-latest
    needs: backend-tests
    steps:
      - uses: actions/checkout@v4

      - name: Install Newman (Postman CLI runner)
        run: npm install -g newman

      - name: Run Postman collection
        run: |
          newman run postman/DevTrack.postman_collection.json \
            -e postman/test.postman_environment.json
